<title>Tindak Lanjut Kalteng I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="claude-shim.js"></script>
<style>
/* Konsep: lembar kerja lapangan. Satu kolom lebar, ringkasan di depan, daftar centang di belakang.
   Hijau = progres selesai, merah = lewat tenggat, kuning = tenggat dekat. */
:root {
  --bg: #F1F4EE;
  --surface: #FFFFFF;
  --surface-2: #E7ECE2;
  --ink: #17211B;
  --ink-2: #4F5E54;
  --line: #D3DACE;
  --accent: #1D6B45;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EADC;
  --late: #B3261E;
  --late-soft: #F8E0DC;
  --soon: #8A5A00;
  --soon-soft: #F5E6C2;
  --track: #DAE1D5;
  --open: #8DA195;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #171F1A; --surface-2: #202B24; --ink: #E6EEE8; --ink-2: #9DAEA2;
    --line: #2C3A31; --accent: #5DBB8A; --accent-ink: #0A1A11; --accent-soft: #1D3A2A;
    --late: #FF8F85; --late-soft: #3B1F1D; --soon: #F0C15A; --soon-soft: #3A2F12; --track: #2A372E; --open: #62776A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #171F1A; --surface-2: #202B24; --ink: #E6EEE8; --ink-2: #9DAEA2;
  --line: #2C3A31; --accent: #5DBB8A; --accent-ink: #0A1A11; --accent-soft: #1D3A2A;
  --late: #FF8F85; --late-soft: #3B1F1D; --soon: #F0C15A; --soon-soft: #3A2F12; --track: #2A372E; --open: #62776A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.wrap { max-width: 1040px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* kerangka: menu di samping */
.shell { max-width: 1240px; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 32px; align-items: start; }
.main { min-width: 0; }
.side { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 20px; }
.brand h1 { font-family: var(--font-head); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; font-weight: 500; min-height: 40px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.tabs { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 12px; }
.tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; padding: 10px 12px; font-family: var(--font-head); font-weight: 600; font-size: 17px; letter-spacing: .02em; color: var(--ink-2); min-height: 44px; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); border-left-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--ink-2); }
.side-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.panel[hidden] { display: none; }

/* ringkasan: angka utama */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.kpi { padding: 14px 16px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font-family: var(--font-mono); font-size: 30px; font-weight: 500; line-height: 1.1; }
.kpi .v small { font-size: 14px; color: var(--ink-2); font-weight: 400; margin-left: 4px; }
.kpi .l { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.kpi.late .v { color: var(--late); }
.kpi.soon .v { color: var(--soon); }
.kpi.done .v { color: var(--accent); }
.overall { margin: 14px 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--track); }
.bar span { display: block; height: 100%; }
.bar .d { background: var(--accent); }
.bar .l { background: var(--late); }
.bar.thick { height: 14px; }

.cat { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 8px; font-family: var(--font-head); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.cat .mono { letter-spacing: 0; text-transform: none; font-weight: 400; }
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.unit-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(80px, 1.4fr) 48px 112px 18px; gap: 6px 16px; align-items: center; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 52px; }
.uname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ucount { font-size: 14px; white-space: nowrap; text-align: right; }
.unit-head .pill { justify-self: start; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.late { background: var(--late-soft); color: var(--late); font-weight: 500; }
.pill.soon { background: var(--soon-soft); color: var(--soon); font-weight: 500; }
.pill.ok { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); transition: transform .15s; justify-self: end; }
.unit-head[aria-expanded="true"] .chev { transform: rotate(-135deg); }
.unit-body { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 14px; }
.unit-body[hidden] { display: none; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
.cols h4 { margin: 0 0 6px; font-family: var(--font-head); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.cols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cols li { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.cols li .m { display: block; font-size: 12px; color: var(--ink-2); }
.cols li .m.late { color: var(--late); }
.cols .none { color: var(--ink-2); font-size: 14px; }
.picline { font-size: 13px; color: var(--ink-2); }
.picline b { font-weight: 600; color: var(--ink); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* dashboard: wawasan */
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.ins { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.ins.wide { margin-top: 12px; }
.ins h3 { margin: 0; font-family: var(--font-head); font-size: 17px; font-weight: 600; }
.ins .cap { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 10px; }
.att { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.att li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.att .days { color: var(--late); font-size: 13px; font-weight: 500; padding-top: 1px; }
.att .t { overflow-wrap: anywhere; }
.att .m { display: block; font-size: 12px; color: var(--ink-2); }
.pr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; gap: 10px; align-items: center; width: 100%; background: none; border: 0; padding: 4px 0; text-align: left; border-radius: 4px; }
.pr:hover { background: var(--surface-2); }
.pr .pn { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .pv { font-size: 13px; text-align: right; }
.pr .bar { height: 12px; background: transparent; gap: 2px; }
.bar .o { background: var(--open); }
.bar .l, .bar .o { border-radius: 0 3px 3px 0; }
.mcols { display: flex; align-items: flex-end; gap: 10px; height: 168px; padding-top: 4px; overflow-x: auto; }
.mc { flex: 1 0 44px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
.mc .mv { font-size: 12px; color: var(--ink); }
.mc .mb { width: 100%; max-width: 56px; border-radius: 4px 4px 0 0; min-height: 2px; }
.mc .mb.past { background: var(--late); }
.mc .mb.next { background: var(--open); }
.mc .ml { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.sec h2 { margin: 0; font-family: var(--font-head); font-size: 22px; font-weight: 600; }
.legend { margin-bottom: 4px; }

/* login, akun, pengguna */
.login { min-height: 80vh; display: grid; place-items: center; }
.lcard { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 6px; }
.lcard h2 { margin: 0; font-family: var(--font-head); font-size: 28px; font-weight: 600; }
.lcard .brand-s { color: var(--ink-2); font-size: 13px; margin-bottom: 10px; }
.fld { display: grid; gap: 4px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.fld input, .fld select { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
.rm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
.lcard .btn.primary { width: 100%; margin-top: 8px; }
.who { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.who .wn { font-weight: 600; overflow-wrap: anywhere; }
.who .wr { font-size: 12px; color: var(--ink-2); }
.who .wa { display: flex; gap: 14px; margin-top: 6px; }
.pill.mine { margin-left: 8px; vertical-align: 1px; }
.note-row { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.add { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: end; margin-top: 10px; }
.add .fld { margin-top: 0; }
.add .btn { min-height: 42px; }
td .btn { margin-right: 6px; }
@media (max-width: 720px) { .add { grid-template-columns: minmax(0, 1fr); } }

/* filter checklist */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.filters input, .filters select { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); margin-bottom: 14px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 8px 14px; min-height: 38px; border-left: 1px solid var(--line); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg .n { font-family: var(--font-mono); font-size: 12px; margin-left: 6px; opacity: .8; }

.ug { margin-bottom: 26px; }
.ug > h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 4px; font-family: var(--font-head); font-size: 20px; font-weight: 600; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.ug > h3 .mono { font-size: 13px; font-weight: 400; color: var(--ink-2); }
.gl { margin: 14px 0 2px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-family: var(--font-head); font-weight: 600; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); border-bottom: 1px solid var(--line); padding: 4px 0; }
.chk { position: relative; display: flex; align-items: flex-start; justify-content: center; padding-top: 9px; cursor: pointer; min-height: 44px; }
.chk input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 2px solid var(--ink-2); border-radius: 5px; background: var(--surface); position: relative; cursor: pointer; }
.chk input:checked { background: var(--accent); border-color: var(--accent); }
.chk input:checked::after { content: ""; position: absolute; left: 6px; top: 1px; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.chk input:disabled { cursor: not-allowed; opacity: .6; }
.ib { padding: 8px 4px 8px 0; min-width: 0; }
.txt { overflow-wrap: anywhere; }
.item.done .txt { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--line); }
.det { margin: 4px 0 0; padding-left: 16px; color: var(--ink-2); font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.pic { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); padding: 1px 7px; border-radius: 4px; color: var(--ink); }
.due.late { color: var(--late); font-weight: 500; }
.due.soon { color: var(--soon); font-weight: 500; }
.due.done { color: var(--accent); font-weight: 500; }
.lnk { background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 12.5px; }
.rem, .note { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; white-space: pre-line; overflow-wrap: anywhere; }
.rem { background: var(--surface-2); }
.rem b, .note b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; font-family: var(--font-head); }
.note { background: var(--accent-soft); }
.note textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); resize: vertical; }
.empty { border: 1px dashed var(--ink-2); border-radius: 8px; padding: 28px 20px; text-align: center; color: var(--ink-2); background: var(--surface); }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-family: var(--font-head); font-size: 20px; }
.empty .btn { margin-top: 12px; }

/* impor */
.drop { border: 2px dashed var(--ink-2); border-radius: 10px; background: var(--surface); padding: 32px 20px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0 0 12px; }
.drop .hint { color: var(--ink-2); font-size: 13px; margin-top: 10px; }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
.card h3 { margin: 0 0 4px; font-family: var(--font-head); font-size: 18px; }
.card .sm { color: var(--ink-2); font-size: 13px; }
.tbl { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-head); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-mono); }
.modes { display: grid; gap: 8px; margin: 14px 0; }
.mode { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.mode input { margin-top: 3px; accent-color: var(--accent); }
.mode b { display: block; }
.mode span { font-size: 13px; color: var(--ink-2); }
.err { background: var(--late-soft); color: var(--late); border-radius: 6px; padding: 10px 12px; margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
select.s { min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); max-width: 100%; }

/* toast & modal salin */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 40; max-width: min(92vw, 520px); font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--late); color: #fff; }
.toast[hidden] { display: none; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal .box { background: var(--surface); border-radius: 10px; padding: 16px; width: min(640px, 100%); max-height: 86vh; display: grid; gap: 10px; }
.modal textarea { width: 100%; height: 50vh; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); }

@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .unit-head { grid-template-columns: minmax(0, 1fr) auto auto 18px; }
  .unit-head .pill { justify-self: end; }
  .unit-head .bar { grid-column: 1 / -1; grid-row: 2; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .insights { grid-template-columns: minmax(0, 1fr); }
  .pr { grid-template-columns: 88px minmax(0, 1fr) 30px; }
  .filters { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-block: 4px 0; margin-top: -4px; }
  .brand { flex: 1 1 auto; min-width: 0; }
  .brand h1 { font-size: 21px; }
  .brand .sub { display: none; }
  .side-foot { order: 2; }
  .tabs { order: 3; width: 100%; flex-direction: row; border-top: 0; border-bottom: 1px solid var(--line); padding-top: 0; overflow-x: auto; gap: 0; }
  .tab { width: auto; border-left: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none !important; padding: 8px 14px 6px; white-space: nowrap; gap: 8px; font-size: 16px; }
  .tab[aria-selected="true"] { border-bottom-color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap shell">
  <aside class="side">
    <div class="brand">
      <h1>Tindak Lanjut Kalteng I</h1>
      <div class="sub" id="sub">Memuat data…</div>

<script>
/* ---- Parser MoM (kolom: NO | KEPUTUSAN/PEMBAHASAN | ... | PIC | DUE DATE | STATUS | REMARK) ---- */
function parseMoM(grid, sheetName) {
  const str = v => (v == null ? '' : String(v).trim());
  const isNum = v => typeof v === 'number' || (typeof v === 'string' && /^\d+(\.\d+)?$/.test(v.trim()));
  const ACR = new Set(['GBSM', 'MIK', 'CSR', 'HPS', 'PT', 'KTU', 'EM']);
  const niceName = s => s.split(/\s+/).map(w => ACR.has(w.toUpperCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  const iso = v => {
    if (v == null || v === '') return '';
    if (v instanceof Date) { const d = new Date(v.getTime() + 12 * 36e5); return d.toISOString().slice(0, 10); }
    if (typeof v === 'number') { if (v > 20000 && v < 90000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10); return ''; }
    const s = String(v).trim(); let m;
    if ((m = s.match(/(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    return '';
  };
  const TERM = /[.;:!?]$/;
  const addLine = (arr, line) => {
    line = line.trim(); if (!line) return;
    if (arr.length && /^[a-z]/.test(line) && !TERM.test(arr[arr.length - 1])) arr[arr.length - 1] += ' ' + line;
    else arr.push(line);
  };

  let h = -1, col = {};
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r] || [];
    const idx = re => row.findIndex(v => typeof v === 'string' && re.test(v.trim()));
    const p = idx(/^pic$/i), s = idx(/^status$/i);
    if (p >= 0 && s >= 0) { h = r; col = { pic: p, status: s, due: idx(/^due\s*date$/i), remark: idx(/^remark/i), no: idx(/^no$/i), label: idx(/keputusan|pembahasan/i) }; break; }
  }
  if (h < 0) throw new Error('Kolom PIC dan STATUS tidak ditemukan. Pastikan sheet memakai format MoM Review (ada kolom NO, KEPUTUSAN/PEMBAHASAN, PIC, DUE DATE, STATUS, REMARK).');
  if (col.label < 0) col.label = 2;
  if (col.no < 0) col.no = col.label - 1;
  if (col.due < 0) col.due = col.pic + 1;
  if (col.remark < 0) col.remark = col.status + 1;
  const tcol = col.label + 1;

  // info rapat (di atas tabel)
  const meta = { sheet: sheetName || '', title: '', date: '' };
  for (let r = 0; r < h; r++) {
    const row = grid[r] || [];
    const i = row.findIndex(v => typeof v === 'string' && /^tanggal$/i.test(v.trim()));
    if (i >= 0) {
      const rest = row.slice(i + 1).map(str).filter(x => x && x !== ':');
      meta.date = rest[0] || ''; meta.title = (rest[1] || '').replace(/\s*\n\s*/g, ' · ');
      break;
    }
  }

  const items = [];
  let unit = null, unitIdx = -1, group = '', cur = null, head = null, n = 0;
  const mk = (text, pic, due, status) => ({ unit: niceName(unit), unitIdx, group, text, details: [], pic, due, status, rem: [] });
  const flush = () => {
    if (cur && (cur.pic || cur.status)) {
      cur.remark = cur.rem.join('\n'); delete cur.rem; cur.ord = unitIdx * 1000 + (n++); cur.period = meta.sheet; items.push(cur);
    }
    cur = null;
  };
  for (let r = h + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const b = str(row[col.no]), c = row[col.label], cs = str(c), d = str(row[tcol]);
    const l = str(row[col.pic]), m = row[col.due], st = str(row[col.status]), o = str(row[col.remark]);
    if (/^[IVXL]+$/.test(b) && cs && !d) { flush(); head = null; unit = cs; unitIdx++; group = ''; n = 0; continue; }
    if (!d && cs && !isNum(c) && !l) { flush(); head = null; group = /^outstanding/i.test(cs) ? 'Outstanding' : cs; continue; }
    if (!unit) continue;
    const startsNew = isNum(c);
    if (d) {
      if (startsNew) head = null;
      if (l || st) {
        if (cur && !cur.pic && !cur.status && !startsNew) { head = cur; cur = null; } else flush();
        cur = mk(head ? head.text + ' ' + d : d, l, iso(m), st);
      } else if (startsNew) { flush(); cur = mk(d, '', '', ''); }
      else if (cur) {
        if (/^[a-z]/.test(d) && !TERM.test(cur.details.length ? cur.details[cur.details.length - 1] : cur.text)) {
          if (cur.details.length) cur.details[cur.details.length - 1] += ' ' + d; else cur.text += ' ' + d;
        } else cur.details.push(d);
      }
    } else if (cur && l && !cur.pic) { cur.pic = l; cur.due = iso(m); cur.status = st; }
    if (o && cur) o.split(/\n+/).forEach(x => addLine(cur.rem, x));
  }
  flush();

  // id stabil dari unit + teks
  const hash = (s, seed) => { let x = seed >>> 0; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); };
  const seen = {};
  items.forEach(it => {
    const norm = (it.unit + '|' + it.text).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    let id = 'i' + hash(norm, 2166136261) + hash(norm, 83492791);
    if (seen[id]) { seen[id]++; id += 'x' + seen[id]; } else seen[id] = 1;
    it.id = id;
    it.isDone = /^(done|closed?|selesai|complete[d]?|finish(ed)?)$/i.test(it.status);
  });
  return { meta, items };
}
if (typeof module !== 'undefined') module.exports = { parseMoM };

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const pad = n => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
  const fmt = iso => { if (!iso) return '–'; const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON[m - 1] + ' ' + y; };
  const msg = e => (e && (e.message || e.code)) || String(e);
  const RANK_NAME = ['Kebun', 'Pabrik', 'Pendukung'];
  const rankOf = u => /estate|plasma/i.test(u) ? 0 : /mill/i.test(u) ? 1 : 2;
  const picTokens = p => String(p || '').split(/\s*&\s*|\s*,\s*/).map(x => x.trim()).filter(Boolean);

  const S = {
    db: null, user: null, dl: null, uid: null, canWrite: true, loaded: false, noDb: false,
    items: [], meta: null, names: {}, tab: 'ringkasan', users: [], usersLoaded: false, me: null, entered: false, fails: 0, lockUntil: 0, pwSelf: false, confirmU: null,
    f: { q: '', unit: '', pic: '', st: 'all' },
    openUnits: new Set(), openNotes: new Set(), openRem: new Set(), today: todayISO(),
  };
  let IMP = null;

  /* ---------- turunan data ---------- */
  function derive() {
    S.today = todayISO();
    const t = dayNum(S.today);
    S.items.forEach(i => {
      i.late = !i.done && !!i.due && dayNum(i.due) < t;
      i.daysLate = i.late ? t - dayNum(i.due) : 0;
      const left = i.due ? dayNum(i.due) - t : null;
      i.soon = !i.done && left != null && left >= 0 && left <= 14;
      i.left = left;
    });
    S.items.sort((a, b) => (a.ord || 0) - (b.ord || 0));
  }
  function unitList() {
    const m = new Map();
    S.items.forEach(i => { if (!m.has(i.unit)) m.set(i.unit, { name: i.unit, items: [], ord: i.ord || 0 }); const u = m.get(i.unit); u.items.push(i); u.ord = Math.min(u.ord, i.ord || 0); });
    return [...m.values()].sort((a, b) => rankOf(a.name) - rankOf(b.name) || a.ord - b.ord);
  }
  const stat = list => {
    const s = { total: list.length, done: 0, late: 0, soon: 0, open: 0 };
    list.forEach(i => { if (i.done) s.done++; else { s.open++; if (i.late) s.late++; else if (i.soon) s.soon++; } });
    s.pct = s.total ? Math.round(s.done * 100 / s.total) : 0;
    return s;
  };
  const segBar = (s, thick) => {
    const t = s.total || 1;
    return `<div class="bar${thick ? ' thick' : ''}" role="img" aria-label="${s.done} selesai, ${s.late} terlambat, dari ${s.total}"><span class="d" style="width:${s.done * 100 / t}%"></span><span class="l" style="width:${s.late * 100 / t}%"></span></div>`;
  };
  const dueBadge = i => {
    if (i.done) return `<span class="due done">Selesai${i.doneAt ? ' ' + fmt(i.doneAt) : ''}${i.doneUser ? ' · ' + esc(i.doneUser) : i.doneBy && S.names[i.doneBy] ? ' · ' + esc(S.names[i.doneBy]) : ''}</span>`;
    if (!i.due) return '<span class="due">Tanpa tenggat</span>';
    if (i.late) return `<span class="due late">Terlambat ${i.daysLate} hari · ${fmt(i.due)}</span>`;
    if (i.soon) return `<span class="due soon">${i.left === 0 ? 'Tenggat hari ini' : 'Tenggat ' + i.left + ' hari lagi'} · ${fmt(i.due)}</span>`;
    return `<span class="due">Tenggat ${fmt(i.due)}</span>`;
  };

  /* ---------- toast & salin ---------- */
  let tt;
  function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 2800); }
  function showModal(title, text) { $('#modalTitle').textContent = title; const ta = $('#modalText'); ta.value = text; $('#modal').hidden = false; ta.focus(); ta.select(); }
  async function copyText(title, text) {
    try { await navigator.clipboard.writeText(text); toast('Tersalin: ' + title); }
    catch (e) { showModal(title, text); }
  }
  $('#modalClose').onclick = () => { $('#modal').hidden = true; };
  $('#modalCopy').onclick = async () => { const ta = $('#modalText'); ta.select(); try { await navigator.clipboard.writeText(ta.value); toast('Tersalin'); } catch (e) { toast('Tekan Ctrl+C untuk menyalin', true); } };

  function unitText(u) {
    const s = stat(u.items);
    const done = u.items.filter(i => i.done), open = u.items.filter(i => !i.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const L = [`*${u.name}* – ${s.done}/${s.total} selesai (${s.pct}%), ${s.late} terlambat`];
    if (done.length) { L.push('Selesai:'); done.forEach(i => L.push(`[x] ${i.text} (${i.pic})${i.doneAt ? ' – ' + fmt(i.doneAt) : ''}${i.note ? ' – ' + i.note : ''}`)); }
    if (open.length) {
      L.push('Belum selesai:');
      open.forEach(i => L.push(`[ ] ${i.text} (${i.pic}, tenggat ${fmt(i.due)}${i.late ? ', terlambat ' + i.daysLate + ' hari' : ''})${i.note ? ' – ' + i.note : ''}`));
    }
    return L.join('\n');
  }
  function allText() {
    const s = stat(S.items);
    const head = `Tindak lanjut MoM${S.meta && S.meta.title ? ' ' + S.meta.title : ''} – per ${fmt(S.today)}\nTotal: ${s.done}/${s.total} selesai (${s.pct}%), ${s.late} terlambat\n`;
    return head + '\n' + unitList().map(unitText).join('\n\n');
  }

  /* ---------- ringkasan ---------- */
  function renderSummary() {
    const el = $('#p-ringkasan');
    if (!S.loaded) { el.innerHTML = '<div class="empty">Memuat…</div>'; return; }
    if (S.noDb) { el.innerHTML = '<div class="empty"><h3>Data bersama tidak tersedia</h3>Periksa koneksi internet. Jika Anda pengelola situs ini, pastikan konfigurasi penyimpanan data sudah diisi.</div>'; return; }
    if (!S.items.length) {
      el.innerHTML = isAdmin() ? '<div class="empty"><h3>Belum ada aksi</h3>Unggah file MoM Review (.xlsx) untuk mengisi daftar ini.<br><button class="btn primary" data-go="impor">Upload MoM</button></div>' : '<div class="empty"><h3>Belum ada aksi untuk unit Anda</h3>Admin Region belum mengunggah MoM atau tidak ada aksi untuk ' + esc(myUnit()) + '.</div>';
      return;
    }
    const all = stat(S.items);
    let h = `<div class="kpis">
      <div class="kpi done"><div class="v">${all.done}<small>/ ${all.total}</small></div><div class="l">Selesai · ${all.pct}%</div></div>
      <div class="kpi"><div class="v">${all.open}</div><div class="l">Belum selesai</div></div>
      <div class="kpi late"><div class="v">${all.late}</div><div class="l">Lewat tenggat</div></div>
      <div class="kpi soon"><div class="v">${all.soon}</div><div class="l">Tenggat ≤ 14 hari</div></div></div>
      <div class="overall">${segBar(all, true)}<div class="legend"><span><i style="background:var(--accent)"></i>Selesai</span><span><i style="background:var(--late)"></i>Lewat tenggat</span><span><i style="background:var(--track)"></i>Belum selesai, masih dalam tenggat</span></div></div>
      ${insights()}
      <div class="sec"><h2>Progres per unit</h2><button class="btn small" data-act="copyall">Salin ringkasan semua unit</button></div>`;
    const units = unitList();
    [0, 1, 2].forEach(r => {
      const us = units.filter(u => rankOf(u.name) === r);
      if (!us.length) return;
      const gs = stat(us.flatMap(u => u.items));
      h += `<div class="cat"><span>${RANK_NAME[r]}</span><span class="mono">${gs.done}/${gs.total} selesai</span></div>`;
      us.forEach(u => {
        const s = stat(u.items), open = S.openUnits.has(u.name);
        h += `<div class="unit"><button class="unit-head" data-act="unit" data-u="${esc(u.name)}" aria-expanded="${open}">
          <span class="uname">${esc(u.name)}${S.me && myUnit() === u.name ? '<span class="pill ok mine">Unit Anda</span>' : ''}</span>${segBar(s)}
          <span class="ucount mono">${s.done}/${s.total}</span>
          ${s.late ? `<span class="pill late">${s.late} terlambat</span>` : s.open ? `<span class="pill">${s.open} belum</span>` : '<span class="pill ok">Selesai semua</span>'}
          <span class="chev"></span></button>`;
        if (open) h += unitBody(u);
        h += '</div>';
      });
    });
    el.innerHTML = h;
  }
  function insights() {
    const open = S.items.filter(i => !i.done);
    const worst = open.filter(i => i.late).sort((a, b) => b.daysLate - a.daysLate || (a.ord || 0) - (b.ord || 0)).slice(0, 8);
    const att = worst.length
      ? '<ol class="att">' + worst.map(i => `<li><span class="days mono">${i.daysLate} hr</span><span class="t">${esc(i.text)}<span class="m">${esc(i.unit)} · ${esc(i.pic)} · tenggat ${fmt(i.due)}</span></span></li>`).join('') + '</ol>'
      : '<div class="none" style="color:var(--ink-2)">Tidak ada aksi yang terlambat.</div>';
    const pm = {};
    open.forEach(i => picTokens(i.pic).forEach(p => { const r = pm[p] || (pm[p] = { late: 0, ok: 0 }); i.late ? r.late++ : r.ok++; }));
    const pics = Object.entries(pm).sort((a, b) => (b[1].late + b[1].ok) - (a[1].late + a[1].ok) || a[0].localeCompare(b[0])).slice(0, 10);
    const mx = Math.max(1, ...pics.map(([, r]) => r.late + r.ok));
    const picRows = pics.length ? pics.map(([p, r]) => `<button class="pr" data-act="picfilter" data-p="${esc(p)}" title="${esc(p)}: ${r.late} terlambat, ${r.ok} masih dalam tenggat. Klik untuk membuka checklist.">
        <span class="pn">${esc(p)}</span><div class="bar" role="img" aria-label="${esc(p)}: ${r.late} terlambat, ${r.ok} dalam tenggat"><span class="l" style="width:${r.late * 100 / mx}%"></span><span class="o" style="width:${r.ok * 100 / mx}%"></span></div><span class="pv mono">${r.late + r.ok}</span></button>`).join('')
      : '<div style="color:var(--ink-2)">Semua aksi sudah selesai.</div>';
    // jadwal tenggat per bulan (aksi belum selesai)
    const bm = {}; open.forEach(i => { if (i.due) { const k = i.due.slice(0, 7); bm[k] = (bm[k] || 0) + 1; } });
    const keys = Object.keys(bm).sort();
    let cols = '<div style="color:var(--ink-2)">Tidak ada tenggat yang tercatat.</div>';
    if (keys.length) {
      const toIdx = k => { const [y, m] = k.split('-').map(Number); return y * 12 + m - 1; };
      const a = toIdx(keys[0]), z = toIdx(keys[keys.length - 1]), now = toIdx(S.today.slice(0, 7));
      const top = Math.max(...Object.values(bm)); cols = '';
      for (let x = a; x <= z; x++) {
        const k = Math.floor(x / 12) + '-' + pad(x % 12 + 1), n = bm[k] || 0, past = x < now;
        cols += `<div class="mc" title="${MON[x % 12]} ${Math.floor(x / 12)}: ${n} aksi belum selesai"><span class="mv mono">${n}</span><div class="mb ${past ? 'past' : 'next'}" style="height:${Math.max(n ? 3 : 0, n * 112 / top)}px"></div><span class="ml">${MON[x % 12]} ${String(Math.floor(x / 12)).slice(2)}</span></div>`;
      }
      cols = '<div class="mcols">' + cols + '</div>';
    }
    return `<div class="insights">
      <section class="ins"><h3>Perlu perhatian</h3><div class="cap">Aksi terlambat paling lama</div>${att}</section>
      <section class="ins"><h3>Beban per PIC</h3><div class="cap">Aksi belum selesai, 10 PIC teratas. Klik untuk membuka checklist.</div>${picRows}
        <div class="legend"><span><i style="background:var(--late)"></i>Terlambat</span><span><i style="background:var(--open)"></i>Belum, masih dalam tenggat</span></div></section>
    </div>
    <section class="ins wide"><h3>Jadwal tenggat</h3><div class="cap">Jumlah aksi belum selesai menurut bulan tenggat. Merah = bulan yang sudah lewat.</div>${cols}</section>`;
  }
  function unitBody(u) {
    const done = u.items.filter(i => i.done), open = u.items.filter(i => !i.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const pics = {};
    open.forEach(i => picTokens(i.pic).forEach(p => { pics[p] = (pics[p] || 0) + 1; }));

  /* ---------- impor ---------- */

  function plan() {
    if (!IMP || !IMP.parsed) return;
    const cur = new Map(S.items.map(i => [i.id, i]));
    const ids = new Set(); const per = new Map();
    const P = { add: [], upd: [], same: [], auto: [], missing: [] };

          [...P.per.entries()].map(([u, r]) => `<tr><td>${esc(u)}</td><td class="num">${r.total}</td><td class="num">${r.add}</td><td class="num">${r.upd}</td><td class="num">${r.same}</td></tr>`).join('') + '</tbody></table></div>';

          <label class="mode"><input type="radio" name="mode" value="replace" ${IMP.mode === 'replace' ? 'checked' : ''}><div><b>Ganti</b><span>Hapus aksi yang tidak ada di file ini${P.missing.length ? ' (' + P.missing.length + ' aksi, termasuk centang dan catatannya)' : ''}. Pakai untuk MoM periode baru yang menggantikan yang lama.</span></div></label></div>`;
        const del = IMP.mode === 'replace' && P.missing.length;
        h += `<div class="row"><button class="btn primary" id="doImport" ${S.canWrite ? '' : 'disabled'}>${IMP.busy ? 'Mengimpor… ' + IMP.done + '/' + IMP.total : del ? (IMP.confirm ? 'Klik lagi: hapus ' + P.missing.length + ' aksi dan impor' : 'Impor dan hapus ' + P.missing.length + ' aksi') : 'Impor ' + IMP.parsed.items.length + ' aksi'}</button><button class="btn" id="cancelImport" ${IMP.busy ? 'disabled' : ''}>Batal</button></div>`;

  }
  let xlsxP = null;
  function ensureXlsx() {
    if (window.XLSX) return Promise.resolve(true);
    if (xlsxP) return xlsxP;
    const srcs = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
    xlsxP = (async () => {
      for (const u of srcs) {
        const ok = await new Promise(res => { const sc = document.createElement('script'); sc.src = u; sc.onload = () => res(!!window.XLSX); sc.onerror = () => res(false); setTimeout(() => res(!!window.XLSX), 12000); document.head.appendChild(sc); });
        if (ok) return true;
      }
      return false;
    })().then(r => { if (!r) xlsxP = null; return r; });
    return xlsxP;
  }
  async function handleFile(file) {
    if (!file) return;
    IMP = { file: file.name, sheets: [], err: 'Membaca file…' }; renderImport();
    await ensureXlsx();
    if (!window.XLSX) { IMP = { file: file.name, sheets: [], err: 'Pustaka pembaca Excel belum termuat. Muat ulang halaman lalu coba lagi.' }; renderImport(); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const hid = (wb.Workbook && wb.Workbook.Sheets) || [];
      const sheets = wb.SheetNames.map((n, i) => ({ name: n, hidden: !!(hid[i] && hid[i].Hidden) }));
      IMP = { file: file.name, wb, sheets, sheet: (sheets.find(s => !s.hidden) || sheets[0]).name, mode: 'merge', done: 0, total: 0 };
      analyze();
    } catch (e) { IMP = { file: file.name, sheets: [], err: 'File tidak bisa dibaca: ' + msg(e) }; renderImport(); }
  }
  function analyze() {
    try {
      const ws = IMP.wb.Sheets[IMP.sheet];
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
      IMP.parsed = parseMoM(grid, IMP.sheet);
      IMP.parsed.items.forEach(it => { it.unit = canonUnit(it.unit); });
      IMP.err = IMP.parsed.items.length ? '' : 'Tidak ada aksi yang terbaca di sheet ini. Coba pilih sheet lain.';
      IMP.confirm = false;
      plan();
    } catch (e) { IMP.parsed = null; IMP.err = msg(e); }
    renderImport();
  }
  async function pool(jobs, n, onTick) {
    let k = 0, fail = 0;

      while (k < jobs.length) {
        const j = jobs[k++];

          if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 400)); try { await j(); } catch (e2) { fail++; } } else fail++;

  }
  async function runImport() {
    if (!IMP || !IMP.parsed || IMP.busy) return;
    if (!S.db || !isAdmin()) { toast('Hanya Admin Region yang bisa mengimpor.', true); return; }
    if (!S.canWrite) { toast('Akun Claude Anda hanya bisa melihat, impor tidak bisa disimpan.', true); return; }
    const P = IMP.plan;
    if (IMP.mode === 'replace' && P.missing.length && !IMP.confirm) { IMP.confirm = true; renderImport(); return; }
    const today = todayISO(), jobs = [];
    const exists = new Map(S.items.map(i => [i.id, i]));
    IMP.parsed.items.forEach(it => {
      const ref = S.db.doc('items/' + it.id), ex = exists.get(it.id);
      const base = { unit: it.unit, group: it.group, text: it.text, details: it.details, pic: it.pic, due: it.due, status: it.status, remark: it.remark, period: it.period, ord: it.ord };
      if (!ex) jobs.push(() => ref.set({ ...base, done: !!it.isDone, doneAt: it.isDone ? today : null, doneBy: it.isDone ? S.uid : null, note: '' }));
      else if (changed(ex, it) || (it.isDone && !ex.done)) jobs.push(() => ref.update({ ...base, ...(it.isDone && !ex.done ? { done: true, doneAt: today, doneBy: S.uid } : {}) }));
    });
    if (IMP.mode === 'replace') P.missing.forEach(i => jobs.push(() => S.db.doc('items/' + i.id).delete()));
    IMP.busy = true; IMP.total = jobs.length; IMP.done = 0; renderImport();
    let fail = await pool(jobs, 3, () => { IMP.done++; const b = $('#doImport'); if (b) b.textContent = 'Mengimpor… ' + IMP.done + '/' + IMP.total; });
    try {
      const m = IMP.parsed.meta;

  /* ---------- ekspor ---------- */
  async function exportXlsx() {
    if (!S.dl || !window.XLSX || !S.items.length) return;
    const units = unitList();
    const sum = [['Unit', 'Kelompok', 'Total aksi', 'Selesai', 'Belum selesai', 'Terlambat', '% selesai']];
    units.forEach(u => { const s = stat(u.items); sum.push([u.name, RANK_NAME[rankOf(u.name)], s.total, s.done, s.open, s.late, s.pct / 100]); });
    const a = stat(S.items); sum.push(['Total', '', a.total, a.done, a.open, a.late, a.pct / 100]);
    const rows = [['Unit', 'Kelompok', 'Aksi', 'Detail', 'PIC', 'Tenggat', 'Status', 'Tanggal selesai', 'Status di MoM', 'Progres saat rapat', 'Catatan']];
    units.forEach(u => u.items.forEach(i => rows.push([u.name, i.group, i.text, (i.details || []).join('\n'), i.pic, i.due || '', i.done ? 'Selesai' : i.late ? 'Terlambat' : 'Belum', i.doneAt || '', i.status || '', i.remark || '', i.note || ''])));

    for (let r = 1; r <= sum.length - 1; r++) { const c = w1[XLSX.utils.encode_cell({ r, c: 6 })]; if (c) c.z = '0%'; }
    const w2 = XLSX.utils.aoa_to_sheet(rows); w2['!cols'] = [{ wch: 18 }, { wch: 16 }, { wch: 60 }, { wch: 36 }, { wch: 16 }, { wch: 12 }, { wch: 11 }, { wch: 14 }, { wch: 14 }, { wch: 50 }, { wch: 40 }]; w2['!freeze'] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, w1, 'Ringkasan'); XLSX.utils.book_append_sheet(wb, w2, 'Checklist');

      if (act === 'note' && set.has(id)) { const ta = document.querySelector('textarea[data-note="' + id + '"]'); if (ta) ta.focus(); }
    }
    else if (a.id === 'doImport') runImport();
    else if (act === 'mkaccts') makeAccounts();
    else if (act === 'backup') backupData();
    else if (act === 'restorebtn') $('#restoreFile').click();
    else if (act === 'bootadmin') bootAdmin();
    else if (act === 'ureset' || act === 'udel') userAction(act, a.dataset.id);
  });
  $('#list').addEventListener('change', e => {
    if (e.target.matches('input[data-act="toggle"]')) setDone(e.target.closest('.item').dataset.id, e.target.checked);
  });
  $('#list').addEventListener('focusout', e => {
    if (e.target.matches('textarea[data-note]')) { saveNote(e.target.dataset.note, e.target.value.trim()); setTimeout(() => { if (pending) renderAll(); }, 50); }
  });
  $('#imp').addEventListener('change', e => {
    if (e.target.id === 'shSel' && IMP) { IMP.sheet = e.target.value; analyze(); }
    else if (e.target.name === 'mode' && IMP) { IMP.mode = e.target.value; IMP.confirm = false; renderImport(); }
  });
  $('#imp').addEventListener('click', e => { if (e.target.id === 'cancelImport') { IMP = null; renderImport(); } });
  $('#restoreFile').addEventListener('change', e => { restoreFile(e.target.files[0]); e.target.value = ''; });
  $('#file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  /* ---------- mulai ---------- */
  async function resolveNames() {
    if (!S.user) return;
    const ids = [...new Set(S.items.map(i => i.doneBy).filter(x => x && !(x in S.names)))];
    if (!ids.length) return;
    try {
      const ps = await S.user.profiles(ids);
      ids.forEach(id => { S.names[id] = (ps[id] && ps[id].name) || ''; });
      renderAll();
    } catch (e) { ids.forEach(id => { S.names[id] = ''; }); }
  }
  async function init() {
    go(location.hash.replace('#', '') || 'ringkasan');
    derive(); renderSub(); renderSummary(); renderList(); renderImport();
    if (!window.claude || !window.claude.use) { S.loaded = true; S.noDb = true; gate(); return; }
    S.db = await claude.use('db'); S.user = await claude.use('user'); S.dl = await claude.use('downloads');
    if (S.user) {
      try { S.uid = await S.user.id(); } catch (e) {}
      try { const c = await S.user.can('data.write'); S.canWrite = c !== false; } catch (e) {}
    }
    if (!S.db) { S.loaded = true; S.noDb = true; gate(); return; }
    gate();
    S.db.collection('users').onSnapshot(snapUsers, () => { S.usersLoaded = true; gate(); });
  }
  let started = false;
  function startData() {
    if (started || !S.db) return; started = true;
    S.db.doc('meta/import').onSnapshot(s => { S.meta = s.exists ? s.data() : null; renderAll(); }, () => {});
    S.db.collection('items').onSnapshot(snap => {
      S.raw = snap.docs.map(d => { const o = { id: d.id, ...d.data() }; o.unit = canonUnit(o.unit); return o; }); S.items = S.raw.filter(inScope);
      S.loaded = true; renderAll(); resolveNames(); if (S.tab === 'pengguna') renderUsers();
    }, e => { S.loaded = true; S.noDb = true; renderAll(); });
  }

  /* ---------- akun & login (pembatas tampilan, bukan pengaman penuh) ---------- */
  const ITER = 100000, DEFAULT_PW = 'tap123';
  const isAdmin = () => !!S.me && S.me.role === 'admin';
  const unitKey = u => String(u || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  function canonUnit(u) {
    u = String(u || '').replace(/\s+/g, ' ').trim();
    if (unitKey(u).startsWith('skmmillkcpbiogas')) return 'Skm Mill & Kcp Biogas Plant';
    return u;
  }
  const myUnit = () => (S.me ? canonUnit(S.me.unit) : '');
  const inScope = i => isAdmin() || (!!S.me && i.unit === myUnit());
  const canEdit = i => !!S.canWrite && !!S.me && (isAdmin() || myUnit() === i.unit);
  const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
  async function kdf(pw, saltHex, iter) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unhex(saltHex), iterations: iter, hash: 'SHA-256' }, k, 256));
  }
  async function newCred(pw) {
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    return { salt, iter: ITER, hash: await kdf(pw, salt, ITER) };
  }
  const SESS = 'tl_session';
  const store = n => { try { return window[n]; } catch (e) { return null; } };
  function sessGet() { for (const n of ['sessionStorage', 'localStorage']) { try { const v = JSON.parse(store(n).getItem(SESS) || 'null'); if (v) return v; } catch (e) {} } return null; }
  function sessWhere() { for (const n of ['sessionStorage', 'localStorage']) { try { if (store(n).getItem(SESS)) return n; } catch (e) {} } return 'sessionStorage'; }
  function sessClear() { for (const n of ['sessionStorage', 'localStorage']) { try { store(n).removeItem(SESS); } catch (e) {} } }
  function sessSet(u, remember) {
    const where = remember === undefined ? sessWhere() : remember ? 'localStorage' : 'sessionStorage';
    sessClear();
    try { store(where).setItem(SESS, JSON.stringify({ u: u.id, h: String(u.hash).slice(0, 16) })); } catch (e) {}
  }
  function logout(m) {
    sessClear(); S.me = null; S.entered = false;
    closePw(); gate(); if (m) toast(m);
  }
  function snapUsers(snap) {
    S.users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1) || (a.ord || 0) - (b.ord || 0) || String(a.name).localeCompare(String(b.name)));
    S.usersLoaded = true;
    if (!S.me) {
      const ss = sessGet();
      if (ss) { const u = S.users.find(x => x.id === ss.u); if (u && String(u.hash).slice(0, 16) === ss.h) S.me = u; else sessClear(); }
    } else {
      const u = S.users.find(x => x.id === S.me.id);
      if (!u) { logout('Akun Anda sudah dihapus.'); return; }
      if (u.hash !== S.me.hash && !S.pwSelf) { logout('Kata sandi diubah. Silakan masuk lagi.'); return; }
      S.me = u;
    }
    gate();
    if (S.entered && S.tab === 'pengguna') renderUsers();
  }
  let loginSig = '';
  function gate() {
    const shell = $('.shell'), lg = $('#login');
    if (S.noDb) { lg.hidden = true; shell.hidden = false; renderSummary(); return; }
    if (!S.usersLoaded) { shell.hidden = true; lg.hidden = false; lg.innerHTML = '<div class="lcard"><div class="brand-s">Memuat akun…</div></div>'; loginSig = ''; return; }
    if (!S.me) { shell.hidden = true; lg.hidden = false; closePw(); renderLogin(); return; }
    loginSig = '';
    if (pwForced) closePw();
    lg.hidden = true; shell.hidden = false;
    if (!S.entered) onEnter(); else renderWho();
  }
  function renderLogin() {
    const lg = $('#login');
    const sig = S.users.length ? S.users.map(u => u.id + ':' + u.name).join('|') : '#kosong:' + (S.canWrite ? 1 : 0);
    if (sig === loginSig && lg.firstChild) return;
    loginSig = sig;
    if (!S.users.length) { lg.innerHTML = `<div class="lcard"><h2>Belum ada akun</h2><div class="brand-s">Data masih kosong. Pengelola dapat memulihkan dari file cadangan, atau membuat akun admin awal (kata sandi ${DEFAULT_PW}) lalu mengunggah MoM.</div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn primary" data-act="restorebtn" ${S.canWrite ? '' : 'disabled'}>Pulihkan dari cadangan</button><button class="btn" data-act="bootadmin" ${S.canWrite ? '' : 'disabled'}>Buat akun admin awal</button></div></div>`; return; }
    lg.innerHTML = `<form class="lcard" id="lgForm" autocomplete="on">
      <h2>Masuk</h2><div class="brand-s">Tindak Lanjut MoM Kalteng I. Pilih akun unit Anda.</div>
      <label class="fld" for="lgUser">Akun<select id="lgUser">${S.users.map(u => `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></label>
      <label class="fld" for="lgPw">Kata sandi<input type="password" id="lgPw" autocomplete="current-password"></label>
      <label class="rm"><input type="checkbox" id="lgRem"> Ingat di perangkat ini</label>
      <div class="err" id="lgErr" hidden></div>
      <button class="btn primary" type="submit" id="lgGo">Masuk</button></form>`;
  }
  async function doLogin() {
    const err = $('#lgErr'), btn = $('#lgGo');
    const showErr = t => { err.textContent = t; err.hidden = false; };
    const now = Date.now();
    if (now < S.lockUntil) { showErr('Terlalu banyak percobaan. Coba lagi ' + Math.ceil((S.lockUntil - now) / 1000) + ' detik.'); return; }
    const u = S.users.find(x => x.id === $('#lgUser').value), pw = $('#lgPw').value;
    if (!u || !pw) { showErr('Pilih akun dan isi kata sandi.'); return; }
    if (!window.crypto || !crypto.subtle) { showErr('Browser ini tidak mendukung login. Gunakan browser versi terbaru.'); return; }
    btn.disabled = true;
    let ok = false;
    try { ok = (await kdf(pw, u.salt, u.iter || ITER)) === u.hash; } catch (e) {}
    btn.disabled = false;
    if (!ok) { S.fails++; if (S.fails >= 3) S.lockUntil = Date.now() + Math.min(60000, 5000 * (S.fails - 2)); showErr('Kata sandi salah.'); $('#lgPw').select(); return; }
    S.fails = 0; S.me = u; S.entered = false; sessSet(u, $('#lgRem').checked);
    if (S.canWrite) S.db.doc('users/' + u.id).update({ lastLogin: new Date().toISOString() }).catch(() => {});
    gate();
  }
  function onEnter() {
    S.entered = true;
    if (S.raw) S.items = S.raw.filter(inScope);
    startData();
    S.f = { q: '', unit: isAdmin() ? '' : myUnit(), pic: '', st: 'all' }; $('#fq').value = '';
    $('#tab-impor').hidden = !isAdmin(); $('#tab-pengguna').hidden = !isAdmin();
    renderWho();
    go(location.hash.replace('#', '') || 'ringkasan');
    renderAll();
  }
  function renderWho() {
    const w = $('#who'); if (!S.me) { w.hidden = true; return; }
    w.hidden = false;
    w.innerHTML = `<div class="wn">${esc(S.me.name)}</div><div class="wr">${isAdmin() ? 'Admin Region · semua unit' : 'Menampilkan data unit Anda saja'}</div>
      <div class="wa"><button class="lnk" data-act="mypw">Ganti sandi</button><button class="lnk" data-act="logout">Keluar</button></div>`;
  }

  /* ganti kata sandi */
  let pwForced = false;
  function openPw(forced) {
    pwForced = !!forced;
    $('#pwTitle').textContent = forced ? 'Ganti kata sandi awal' : 'Ganti kata sandi';
    $('#pwSub').textContent = forced ? 'Untuk keamanan, kata sandi awal harus diganti sebelum Anda memakai aplikasi.' : '';
    ['pwOld', 'pwNew', 'pwNew2'].forEach(id => { $('#' + id).value = ''; });
    $('#pwErr').hidden = true; $('#pwCancel').hidden = pwForced; $('#pwOut').hidden = !pwForced;
    $('#pwm').hidden = false; $('#pwOld').focus();
  }
  function closePw() { pwForced = false; $('#pwm').hidden = true; }
  async function savePw() {
    const err = $('#pwErr'), showErr = t => { err.textContent = t; err.hidden = false; };
    const o = $('#pwOld').value, n = $('#pwNew').value, n2 = $('#pwNew2').value;
    if (!S.me) return;
    if (!S.canWrite) { showErr('Akun Claude Anda hanya bisa melihat, jadi kata sandi tidak bisa disimpan.'); return; }
    let ok = false; try { ok = (await kdf(o, S.me.salt, S.me.iter || ITER)) === S.me.hash; } catch (e) {}
    if (!ok) { showErr('Kata sandi saat ini salah.'); return; }
    if (n.length < 6) { showErr('Kata sandi baru minimal 6 karakter.'); return; }
    if (n === DEFAULT_PW) { showErr('Kata sandi baru tidak boleh sama dengan kata sandi awal.'); return; }
    if (n !== n2) { showErr('Pengulangan kata sandi tidak sama.'); return; }
    S.pwSelf = true;
    try {
      const cred = await newCred(n);
      await S.db.doc('users/' + S.me.id).update({ ...cred, mustChange: false, pwUpdatedAt: new Date().toISOString() });
      S.me = { ...S.me, ...cred, mustChange: false }; sessSet(S.me);
      toast('Kata sandi diganti'); closePw(); gate();
    } catch (e) { showErr('Gagal menyimpan: ' + msg(e)); }
    S.pwSelf = false;
  }

  /* kelola pengguna (admin) */
  function renderUsers() {
    const el = $('#p-pengguna'); if (!isAdmin()) { el.innerHTML = ''; return; }
    const units = [...new Set([...S.items.map(i => i.unit), ...S.users.map(u => canonUnit(u.unit))].filter(u => u && u !== '*'))].sort();
    const have = new Set(S.users.map(u => canonUnit(u.unit)));
    const miss = [...new Set(S.items.map(i => i.unit))].filter(u => u && !have.has(u)).sort();
    const cf = S.confirmU;
    el.innerHTML = `<div class="sec" style="margin-top:0"><h2>Pengguna</h2></div>
      <p class="note-row">Satu akun per unit. Kata sandi awal semua akun: <b class="mono">${DEFAULT_PW}</b>. Pengguna bisa menggantinya sendiri lewat tautan Ganti sandi di sidebar. Akun unit hanya bisa mencentang dan mencatat di unitnya sendiri; admin bisa semua unit, upload MoM, dan mengelola akun.</p>
      ${miss.length ? `<div class="card" style="margin-top:0"><h3>${miss.length} unit belum punya akun</h3><div class="sm">${miss.map(esc).join(' · ')}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="mkaccts" ${S.canWrite ? '' : 'disabled'}>Buat akun untuk ${miss.length} unit (sandi ${DEFAULT_PW})</button></div></div>` : ''}
      <div class="card" style="margin-top:${miss.length ? '14px' : '0'}"><div class="tbl" style="margin-top:0"><table><thead><tr><th>Nama akun</th><th>Unit</th><th>Kata sandi</th><th>Terakhir masuk</th><th></th></tr></thead><tbody>
      ${S.users.map(u => { const me = S.me.id === u.id; const rk = cf && cf.id === u.id && cf.kind === 'ureset', dk = cf && cf.id === u.id && cf.kind === 'udel';
        return `<tr><td><b>${esc(u.name)}</b> <span class="mono" style="color:var(--ink-2)">${esc(u.id)}</span></td><td>${u.unit === '*' ? 'Semua unit' : esc(u.unit)}</td>
        <td>${!u.pwUpdatedAt ? '<span class="pill soon">Masih sandi awal</span>' : '<span class="pill ok">Sudah diganti</span>'}</td>
        <td>${u.lastLogin ? fmt(String(u.lastLogin).slice(0, 10)) : '–'}</td>
        <td>${me ? '<span class="pill">Anda</span>' : `<button class="btn small" data-act="ureset" data-id="${esc(u.id)}">${rk ? 'Yakin? Klik lagi' : 'Reset ke ' + DEFAULT_PW}</button><button class="btn small" data-act="udel" data-id="${esc(u.id)}">${dk ? 'Yakin? Klik lagi' : 'Hapus'}</button>`}</td></tr>`; }).join('')}
      </tbody></table></div></div>
      <div class="card"><h3>Tambah akun</h3><div class="sm">Akun baru memakai kata sandi awal ${DEFAULT_PW}.</div>
      <form class="add" id="addForm"><label class="fld" for="auName">Nama tampilan<input id="auName" placeholder="mis. KTU Mill A" required></label>
        <label class="fld" for="auId">Username<input id="auId" placeholder="huruf kecil/angka" pattern="[a-z0-9]{3,20}" required></label>
        <label class="fld" for="auUnit">Unit<select id="auUnit">${units.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')}<option value="*">Semua unit (admin)</option></select></label>
        <button class="btn primary" type="submit">Tambah</button></form><div class="err" id="auErr" hidden></div></div>
      <div class="card"><h3>Cadangan data</h3><div class="sm">Simpan seluruh akun, aksi, centang, dan catatan ke satu file, atau pulihkan dari file tersebut. Memulihkan menimpa data dengan ID yang sama.</div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap">${S.dl ? '<button class="btn" data-act="backup">Unduh cadangan (.json)</button>' : ''}<button class="btn" data-act="restorebtn" ${S.canWrite ? '' : 'disabled'}>Pulihkan dari cadangan</button></div></div>`;
  }
  async function userAction(kind, id) {
    if (!isAdmin() || !S.canWrite || id === S.me.id) return;
    if (!S.confirmU || S.confirmU.id !== id || S.confirmU.kind !== kind) { S.confirmU = { id, kind }; renderUsers(); setTimeout(() => { if (S.confirmU && S.confirmU.id === id) { S.confirmU = null; if (S.tab === 'pengguna') renderUsers(); } }, 5000); return; }
    S.confirmU = null;
    try {
      if (kind === 'ureset') { const cred = await newCred(DEFAULT_PW); await S.db.doc('users/' + id).update({ ...cred, mustChange: false, pwUpdatedAt: null }); toast('Kata sandi direset ke ' + DEFAULT_PW); }
      else { await S.db.doc('users/' + id).delete(); toast('Akun dihapus'); }
    } catch (e) { toast('Gagal: ' + msg(e), true); }
    renderUsers();
  }
  async function backupData() {
    if (!isAdmin() || !S.dl) return;
    const drop = ['late', 'daysLate', 'soon', 'left'];
    const clean = o => { const { id, ...r } = o; drop.forEach(k => { delete r[k]; }); return { id, data: r }; };
    const data = { v: 1, app: 'tindak-lanjut-kalteng-i', exportedAt: new Date().toISOString(), meta: S.meta || null, users: S.users.map(clean), items: (S.raw || S.items).map(clean) };
    try { await S.dl.save({ filename: 'Cadangan-Tindak-Lanjut_' + todayISO() + '.json', data: JSON.stringify(data) }); toast('Cadangan disimpan: ' + data.users.length + ' akun, ' + data.items.length + ' aksi'); }
    catch (e) { if (!e || e.code !== 'declined') toast('Gagal menyimpan cadangan', true); }
  }
  async function restoreFile(file) {
    if (!file) return;
    if (!S.db || !S.canWrite || !(isAdmin() || !S.users.length)) { toast('Hanya admin yang bisa memulihkan data.', true); return; }
    let d; try { d = JSON.parse(await file.text()); } catch (e) { toast('File cadangan tidak valid.', true); return; }
    if (!d || !Array.isArray(d.items) || !Array.isArray(d.users)) { toast('Isi file bukan cadangan Tindak Lanjut.', true); return; }
    const okId = x => x && typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(x.id) && x.data && typeof x.data === 'object';
    const users = d.users.filter(okId), items = d.items.filter(okId);
    const jobs = [];
    users.forEach(u => jobs.push(() => S.db.doc('users/' + u.id).set(u.data)));
    items.forEach(i => jobs.push(() => S.db.doc('items/' + i.id).set(i.data)));
    if (d.meta && typeof d.meta === 'object') jobs.push(() => S.db.doc('meta/import').set(d.meta));
    toast('Memulihkan ' + jobs.length + ' data…');
    S.pwSelf = true;
    const fail = await pool(jobs, 3, () => {});
    setTimeout(() => { S.pwSelf = false; }, 2500);
    toast(fail ? fail + ' data gagal dipulihkan. Coba lagi dengan file yang sama.' : 'Pulihkan selesai: ' + users.length + ' akun, ' + items.length + ' aksi', !!fail);
    if (S.tab === 'pengguna') renderUsers();
  }
  async function bootAdmin() {
    if (!S.db || !S.canWrite || S.users.length) return;
    try { const cred = await newCred(DEFAULT_PW); await S.db.doc('users/admin').set({ name: 'Admin Region', unit: '*', role: 'admin', ord: 0, ...cred, mustChange: false, createdAt: new Date().toISOString() }); toast('Akun admin dibuat. Masuk dengan kata sandi ' + DEFAULT_PW); }
    catch (e) { toast('Gagal membuat akun: ' + msg(e), true); }
  }
  async function makeAccounts() {
    if (!isAdmin() || !S.canWrite || S.mkBusy) return;
    const have = new Set(S.users.map(u => canonUnit(u.unit)));
    const miss = [...new Set(S.items.map(i => i.unit))].filter(u => u && !have.has(u)).sort();
    if (!miss.length) return;
    S.mkBusy = true; const ids = new Set(S.users.map(u => u.id)); let ok = 0, bad = 0, ord = 50 + S.users.length;
    for (const unit of miss) {
      let base = unitKey(unit).slice(0, 16) || 'unit', id = base, k = 2;
      while (ids.has(id)) id = base + (k++);
      ids.add(id);
      try { const cred = await newCred(DEFAULT_PW); await S.db.doc('users/' + id).set({ name: unit, unit, role: 'unit', ord: ord++, ...cred, mustChange: false, createdAt: new Date().toISOString() }); ok++; } catch (e) { bad++; }
    }
    S.mkBusy = false;
    toast(bad ? ok + ' akun dibuat, ' + bad + ' gagal. Coba lagi.' : ok + ' akun dibuat (sandi ' + DEFAULT_PW + ')', !!bad);
    renderUsers();
  }
  async function addUser() {
    const err = $('#auErr'), showErr = t => { err.textContent = t; err.hidden = false; };
    const name = $('#auName').value.trim(), id = $('#auId').value.trim().toLowerCase(), unit = $('#auUnit').value;
    if (!name || !/^[a-z0-9]{3,20}$/.test(id)) { showErr('Isi nama, dan username 3-20 huruf kecil atau angka.'); return; }
    if (S.users.some(u => u.id === id)) { showErr('Username sudah dipakai.'); return; }
    try {
      const cred = await newCred(DEFAULT_PW);
      await S.db.doc('users/' + id).set({ name, unit, role: unit === '*' ? 'admin' : 'unit', ord: 50 + S.users.length, ...cred, mustChange: false, createdAt: new Date().toISOString() });
      toast('Akun ' + name + ' dibuat'); renderUsers();
    } catch (e) { showErr('Gagal menyimpan: ' + msg(e)); }
  }
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'lgForm') doLogin();
    else if (e.target.id === 'addForm') addUser();
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && a.dataset.act === 'mypw') openPw(false);
    else if (a && a.dataset.act === 'logout') logout();
    else if (e.target.id === 'pwSave') savePw();
    else if (e.target.id === 'pwCancel') closePw();
    else if (e.target.id === 'pwOut') logout();
  });
  init();
})();
</script>
